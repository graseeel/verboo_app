name: Tauri Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.3.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

# Serialize releases so the rolling beta update pointer cannot race.
concurrency:
  group: tauri-release-publish
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Single source of truth for the tag + prerelease flag. Each per-platform
  # job downstream depends on this to avoid repeating the resolution logic.
  # ─────────────────────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          # Strip optional leading "v" for SemVer comparisons.
          VERSION="${TAG#v}"
          # Prerelease if the version matches x.y.z-<channel>.<n>
          if [[ "$VERSION" =~ -(beta|alpha|rc)\.[0-9]+$ ]]; then
            IS_PRE="true"
          else
            IS_PRE="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        run: node scripts/verify/verify-release-version.mjs --tag "${{ steps.release.outputs.tag }}"

      - name: Test release contracts
        run: node --test scripts/verify/update-manifest.test.mjs scripts/verify/verify-release-version.test.mjs scripts/verify/tauri-release-signing.test.mjs

  # ─────────────────────────────────────────────────────────────────────
  # Per-platform builds. Each job:
  #   1. Installs Rust 1.89.0 (pinned per team memory — proc-macro ABI fix)
  #   2. Installs Node + npm ci
  #   3. Runs `cargo tauri build` to produce the platform-specific bundle
  #   4. Uploads artifacts + publishes a GitHub release entry
  # ─────────────────────────────────────────────────────────────────────
  build-tauri:
    name: Build Tauri (${{ matrix.os }} / ${{ matrix.target }})
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # With `cargo tauri build --target <triple>`, bundles land under
          # src-tauri/target/<triple>/release/bundle/ — NOT target/release/bundle/.
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS-Apple-Silicon
            artifact_glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          # macos-15 is arm64; use the Intel runner so native npm modules match.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macOS-Intel
            artifact_glob: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows
            # NSIS only — MSI fails on SemVer prerelease tags (hyphen in version).
            artifact_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Prevent Rust 1.95 (system default) from breaking tauri-cli proc-macros.
      RUSTUP_TOOLCHAIN: "1.89.0"
      # Clear RUSTFLAGS so cargo-tauri's default flags don't break proc-macro
      # linking (ctor-proc-macro "can't find crate" error on Rust 1.89).
      RUSTFLAGS: ""
      # Published Chrome Web Store identity, read at compile time by
      # option_env! (chrome_integration/models.rs, native_host.rs). Without
      # these the shipped app reports "this build has no production extension
      # metadata" and the integration cannot be configured.
      VERBOO_CHROME_EXTENSION_ID: "nkfgdaoblgcbngpklgnmjkfdabpbmpee"
      VERBOO_CHROME_WEB_STORE_URL: "https://chromewebstore.google.com/detail/nkfgdaoblgcbngpklgnmjkfdabpbmpee"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install MSYS2 media build toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            autoconf
            automake
            libtool
            make
            gettext-devel

      - name: Install macOS media build toolchain
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool nasm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config \
            autoconf \
            automake \
            libtool \
            nasm \
            zlib1g-dev \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Cache verified media sidecar source/build directories
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/verboo-media-sidecars-cache
          key: media-sidecars-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/tauri/media-sidecars.json', 'scripts/tauri/build-media-sidecars.mjs') }}

      - name: Build renderer + bundle CLI (build:tauri-deps)
        # Mirrors local `npm run tauri:build` deps prep:
        #   1. dedup-cli-package.mjs  — strip iCloud conflict copies
        #   2. copy-cli-resource.mjs — copy cli.mjs + cli-package/ to src-tauri/resources/
        #   3. build:renderer        — tsc --noEmit + vite build → dist-renderer/
        # beforeBuildCommand is intentionally empty in tauri.conf.json (commit 30fd235)
        # to avoid a double vite build locally, so CI must build the renderer here.
        run: npm run build:tauri-deps

      - name: Build Verboo in Chrome sidecar
        run: node scripts/tauri/build-chrome-helper.mjs --target ${{ matrix.target }}

      - name: Build pinned media sidecars
        if: runner.os != 'Windows'
        env:
          # The builder caches only hash-verified source/build directories. It
          # never caches the target-qualified binaries in src-tauri/binaries.
          # (runner.* is a step-level context; job-level env rejects it.)
          VERBOO_MEDIA_SIDECAR_CACHE: ${{ runner.temp }}/verboo-media-sidecars-cache
        run: npm run build:media-sidecars -- --target ${{ matrix.target }}

      - name: Build pinned media sidecars (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          VERBOO_MEDIA_SIDECAR_CACHE: ${{ runner.temp }}/verboo-media-sidecars-cache
        # Strict MSYS2 PATH keeps the perl autotools' prefix detection sane
        # (path-type: inherit mangled the system aclocal dir); node is added
        # explicitly from the runner image install.
        run: |
          export PATH="$PATH:/c/Program Files/nodejs"
          node scripts/tauri/build-media-sidecars.mjs --target ${{ matrix.target }}

      - name: Verify target-qualified media sidecars
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          EXT=""
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then EXT=".exe"; fi
          BINARIES="src-tauri/binaries"
          ls -lh "$BINARIES/verboo-ffmpeg-$TARGET$EXT" \
            "$BINARIES/verboo-ffprobe-$TARGET$EXT" \
            "$BINARIES/verboo-whisper-$TARGET$EXT"
          "$BINARIES/verboo-ffmpeg-$TARGET$EXT" -version
          "$BINARIES/verboo-ffprobe-$TARGET$EXT" -version
          "$BINARIES/verboo-whisper-$TARGET$EXT" --help >/dev/null
          test ! -e "$BINARIES/ggml-base.bin"

      - name: Install tauri-cli
        # Keep the CLI aligned with package.json while the embedded browser
        # depends on Tauri's unstable multiwebview API.
        run: cargo +1.89.0 install tauri-cli --version "2.11.4" --locked

      - name: Run Rust library tests (Windows)
        # STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139) on Windows cargo test is
        # caused by the DLL loader finding a stale VCRUNTIME140.dll from an
        # embedded app (MySQL, MongoDB, R, OpenSSL, Chocolatey) before the
        # system copy in C:\Windows\System32. The test binary imports only
        # system DLLs + VCRUNTIME140.dll + api-ms-win-crt-*; no MinGW DLLs.
        # We dump DLL resolution paths for forensics, then prepend System32
        # to PATH so the system copy wins.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ── DLL resolution diagnostics ────────────────────────
          # KnownDLLs (kernel32, ntdll, user32, gdi32, ole32, shell32,
          # comctl32, ws2_32, etc.) resolve from the registry, not PATH.
          # Only VCRUNTIME140.dll and bcryptprimitives.dll are searched by
          # PATH. api-ms-win-crt-* are API sets resolved by the apiset
          # schema — they are NEVER found in PATH; "not found" is normal
          # and noted inline to avoid noise.
          $searchableDlls = @(
            "VCRUNTIME140.dll",
            "api-ms-win-crt-runtime-l1-1-0.dll",
            "api-ms-win-crt-stdio-l1-1-0.dll",
            "api-ms-win-crt-math-l1-1-0.dll",
            "api-ms-win-crt-locale-l1-1-0.dll",
            "api-ms-win-crt-heap-l1-1-0.dll",
            "bcryptprimitives.dll"
          )
          $apiSetDlls = @("api-ms-win-crt-runtime-l1-1-0.dll","api-ms-win-crt-stdio-l1-1-0.dll",
                          "api-ms-win-crt-math-l1-1-0.dll","api-ms-win-crt-locale-l1-1-0.dll",
                          "api-ms-win-crt-heap-l1-1-0.dll")
          # where.exe finds files by exact name in PATH + CWD (unlike
          # Get-Command which only resolves PATHEXT executables). It prints
          # ALL matches in search order — the first is what the loader picks.
          function Dump-DllResolution {
            foreach ($dll in $searchableDlls) {
              $found = & where.exe $dll 2>$null
              if ($LASTEXITCODE -eq 0) {
                foreach ($p in $found) {
                  try {
                    $ver = (Get-Item $p -ErrorAction SilentlyContinue).VersionInfo.FileVersion
                    Write-Host "$dll -> $p ($ver)"
                  } catch {
                    Write-Host "$dll -> $p (version unknown: $_)"
                  }
                }
              } elseif ($apiSetDlls -contains $dll) {
                Write-Host "$dll -> (API set — resolved by schema, not PATH; not found here is expected)"
              } else {
                Write-Host "$dll -> não encontrado no PATH"
              }
            }
          }

          Write-Host "::group::DLL resolution ANTES do prepend System32"
          Dump-DllResolution
          Write-Host "::endgroup::"

          # ── Ponto cego: DLLs ao lado do executável ─────────────
          # The Windows loader searches the DIRECTORY OF THE EXE before
          # PATH and even before System32. where.exe does NOT search
          # this directory. A stale VCRUNTIME140.dll sitting next to
          # the test binary is the most likely root cause.
          $testExeDir = "src-tauri/target/${{ matrix.target }}/debug/deps"
          if (Test-Path $testExeDir) {
            Write-Host "::group::DLLs next to test binary ($testExeDir)"
            Get-ChildItem -Path $testExeDir -Filter *.dll -ErrorAction SilentlyContinue |
              ForEach-Object {
                try {
                  $ver = $_.VersionInfo.FileVersion
                  Write-Host "$($_.Name) -> $($_.FullName) ($ver)"
                } catch {
                  Write-Host "$($_.Name) -> $($_.FullName) (version unknown: $_)"
                }
              }
            Write-Host "::endgroup::"
          }

          # ── Mitigation: system copy wins over app-bundled copies ──
          Write-Host "::group::PATH (antes do prepend)"
          $env:PATH -split ";" | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"

          $env:PATH = "C:\Windows\System32;$env:PATH"

          Write-Host "::group::PATH (depois do prepend)"
          $env:PATH -split ";" | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"

          Write-Host "::group::DLL resolution DEPOIS do prepend System32"
          Dump-DllResolution
          Write-Host "::endgroup::"

          $testExit = 0
          try {
            # Set link flags for the test binary via CARGO_ENCODED_RUSTFLAGS
            # (0x1F-delimited, unlike RUSTFLAGS which uses space delimiter
            # and would break on the spaces inside /MANIFESTDEPENDENCY).
            # This must be step-local (not in env:) to limit scope — the
            # bundle build is a different step and won't see these flags.
            $USEP = [char]0x1F
            # No space between -C and link-arg: CARGO_ENCODED_RUSTFLAGS
            # splits on 0x1F, and each element becomes a single argv to
            # rustc. A space inside an element causes "unknown codegen option"
            # because rustc reads the space as part of the option name.
            $env:CARGO_ENCODED_RUSTFLAGS = "-Clink-arg=/MANIFEST:EMBED$USEP-Clink-arg=/MANIFESTDEPENDENCY:type='win32' name='Microsoft.Windows.Common-Controls' version='6.0.0.0' processorArchitecture='*' publicKeyToken='6595b64144ccf1df' language='*'"

            cargo +1.89.0 test --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --lib --locked
            $testExit = $LASTEXITCODE
          } finally {
            # ── Manifest embedding verification ──────────────────
            # Proves whether the /MANIFEST:EMBED + /MANIFESTDEPENDENCY
            # link flags actually embedded Common-Controls 6.0 into the
            # test binary. Runs even if cargo test fails (finally), so
            # we know which half broke: missing manifest = linker issue,
            # manifest present but test failed = different root cause.
            Write-Host "::group::Manifest embedding verification"
            $testExe = Get-ChildItem -Path "src-tauri/target/${{ matrix.target }}/debug/deps/verboo_desktop_lib-*.exe" `
              -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if ($testExe) {
              $content = [System.IO.File]::ReadAllBytes($testExe.FullName)
              # Search BOTH UTF-8 and UTF-16LE — the linker may embed the
              # manifest in either encoding depending on its configuration.
              $utf8Str = [System.Text.Encoding]::UTF8.GetString($content)
              $utf16Str = [System.Text.Encoding]::Unicode.GetString($content)
              $pattern = "Microsoft.Windows.Common-Controls"
              $found8 = $utf8Str.Contains($pattern)
              $found16 = $utf16Str.Contains($pattern)
              if ($found8 -or $found16) {
                $enc = if ($found8 -and $found16) { "UTF-8 + UTF-16" } elseif ($found8) { "UTF-8" } else { "UTF-16LE" }
                Write-Host "ACHADO: Common-Controls 6.0 manifest confirmed in $($testExe.Name) ($enc)"
              } else {
                Write-Host "NAO ACHADO: Common-Controls manifest MISSING from $($testExe.Name)"
                Write-Host "Not found in UTF-8 or UTF-16LE — the linker likely ignored /MANIFESTDEPENDENCY."
              }
            } else {
              Write-Host "NAO ACHADO: no test exe found at debug/deps/verboo_desktop_lib-*.exe"
            }
            Write-Host "::endgroup::"
          }
          if ($testExit -ne 0) { throw "cargo test failed with exit $testExit" }

      - name: Run Rust library tests (Unix)
        # macOS and Linux use bash — no MinGW DLL collision.
        if: runner.os != 'Windows'
        # Run with the matrix.target so the Tauri build script can locate
        # the matching sidecar (e.g. binaries/verboo-in-chrome-<target>);
        # without --target, x86_64 macOS builds on Apple-Silicon runners
        # fail because the host triple resolves to aarch64 but the sidecar
        # built earlier was x86_64.
        shell: bash
        run: |
          set -euo pipefail
          echo '::group::PATH'
          echo "$PATH" | tr ':' '\n'
          echo '::endgroup::'
          cargo +1.89.0 test --target ${{ matrix.target }} --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Prepare Apple notarization credentials
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          for required_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY \
            APPLE_API_KEY \
            APPLE_API_ISSUER
          do
            if [ -z "${!required_name:-}" ]; then
              echo "::error::$required_name is missing"
              exit 1
            fi
          done

          umask 077
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -check -noout
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

          CERTIFICATE_PATH="$RUNNER_TEMP/verboo-developer-id-${{ matrix.target }}.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/verboo-code-signing-${{ matrix.target }}.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r keychain; do
            if [ -n "$keychain" ]; then
              ORIGINAL_KEYCHAINS+=("$keychain")
            fi
          done < <(
            security list-keychains -d user |
              sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//'
          )

          cleanup_codesign_keychain() {
            if [ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains -d user -s "${ORIGINAL_KEYCHAINS[@]}" \
                >/dev/null 2>&1 || true
            else
              security list-keychains -d user -s >/dev/null 2>&1 || true
            fi
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -f "$CERTIFICATE_PATH"
          }
          trap cleanup_codesign_keychain EXIT

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          if [ "${#ORIGINAL_KEYCHAINS[@]}" -gt 0 ]; then
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"
          else
            security list-keychains -d user -s "$KEYCHAIN_PATH"
          fi

          SIGNING_IDENTITY=$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              awk '/Developer ID Application:/ { print $2; exit }'
          )
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in the imported certificate"
            exit 1
          fi

          RESOURCE_ROOT="src-tauri/resources/cli-package"
          test -d "$RESOURCE_ROOT"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) EXPECTED_MACHO_ARCH="arm64" ;;
            x86_64-apple-darwin) EXPECTED_MACHO_ARCH="x86_64" ;;
            *)
              echo "::error::Unsupported macOS target ${{ matrix.target }}"
              exit 1
              ;;
          esac
          SIGNED_MACHO_COUNT=0
          while IFS= read -r -d '' candidate; do
            FILE_DESCRIPTION="$(file -b "$candidate")"
            if [[ "$FILE_DESCRIPTION" == *"Mach-O"* ]]; then
              if [[ "$FILE_DESCRIPTION" != *"$EXPECTED_MACHO_ARCH"* ]]; then
                echo "::error file=$candidate::Expected $EXPECTED_MACHO_ARCH Mach-O, found: $FILE_DESCRIPTION"
                exit 1
              fi
              echo "Signing embedded Mach-O: $candidate ($FILE_DESCRIPTION)"
              codesign --force --options runtime --timestamp \
                --keychain "$KEYCHAIN_PATH" \
                --sign "$SIGNING_IDENTITY" \
                "$candidate"
              codesign --verify --strict --verbose=2 "$candidate"
              SIGNED_MACHO_COUNT=$((SIGNED_MACHO_COUNT + 1))
            fi
          done < <(find "$RESOURCE_ROOT" -type f -print0)
          if [ "$SIGNED_MACHO_COUNT" -eq 0 ]; then
            echo "::error::No Mach-O binaries found in the embedded CLI resources"
            exit 1
          fi
          echo "Signed $SIGNED_MACHO_COUNT embedded CLI Mach-O binaries"

      - name: Build Tauri bundle and signed updater artifacts
        env:
          # Clear RUSTFLAGS so cargo-tauri's default flags don't break proc-macro
          # linking (ctor-proc-macro "can't find crate" error on Rust 1.89).
          RUSTFLAGS: ""
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # These resolve to empty strings outside macOS, so Apple credentials
          # are never exposed to the Windows or Linux matrix jobs.
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"; exit 1; }
          BUILD_LOG="$RUNNER_TEMP/tauri-build-${{ matrix.target }}.log"
          set +e
          cargo +1.89.0 tauri build --target ${{ matrix.target }} 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            exit "$BUILD_STATUS"
          fi
          if grep -Fq "does not match the public key from" "$BUILD_LOG"; then
            echo "::error::Updater private key does not match the exact public key in tauri.conf.json"
            exit 1
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
            for package_dir in deb rpm; do
              PACKAGES=$(find "$BUNDLE_ROOT/$package_dir" -maxdepth 1 -type f -name "*.$package_dir" | sort -u)
              PACKAGE_COUNT=$(printf '%s\n' "$PACKAGES" | sed '/^$/d' | wc -l | tr -d ' ')
              if [ "$PACKAGE_COUNT" != "1" ]; then
                echo "::error::Expected one .$package_dir package, found $PACKAGE_COUNT"
                exit 1
              fi
              cargo +1.89.0 tauri signer sign "$PACKAGES"
            done
          fi

      - name: Verify and notarize macOS release artifacts
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_PATH=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -type d -name '*.app' | head -1)
          DMG_PATH=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -type f -name '*.dmg' | head -1)
          test -n "$APP_PATH"
          test -n "$DMG_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          CODESIGN_INFO=$(codesign --display --verbose=4 "$APP_PATH" 2>&1)
          printf '%s\n' "$CODESIGN_INFO"
          printf '%s\n' "$CODESIGN_INFO" | grep -F 'Authority=Developer ID Application:'
          TEAM_IDENTIFIER=$(printf '%s\n' "$CODESIGN_INFO" | sed -n 's/^TeamIdentifier=//p' | head -1)
          test -n "$TEAM_IDENTIFIER"
          test "$TEAM_IDENTIFIER" != "not set"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          xcrun stapler validate -v "$APP_PATH"

          codesign --verify --strict --verbose=2 "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --output-format json
          xcrun stapler staple -v "$DMG_PATH"
          xcrun stapler validate -v "$DMG_PATH"
          spctl --assess --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$DMG_PATH"

      - name: Remove Apple notarization credentials
        if: always() && runner.os == 'macOS'
        shell: bash
        run: rm -f "${APPLE_API_KEY_PATH:-}"

      - name: Run packaged multiwebview runtime smoke (macOS)
        if: runner.os == 'macOS'
        # CI runners have no graphical session — WKWebView/takeSnapshot never
        # composes a frame and hangs indefinitely (with_webview is synchronous).
        # The env flag makes run_runtime_smoke skip the two snapshot steps,
        # set snapshotBytes=0 with a dummy snapshot error, and proceed to
        # destroy. The launcher tolerates this as a headless artifact (warns,
        # does not block). Locally with a display the snapshot runs normally
        # and is validated — coverage was moved, not lost.
        env:
          VERBOO_SMOKE_SKIP_SNAPSHOT: '1'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          node scripts/verify/browser-multiwebview-smoke.mjs "$APP_PATH"

      - name: Run packaged multiwebview runtime smoke (Windows)
        if: runner.os == 'Windows'
        # Skip snapshot on headless CI — same rationale as macOS.
        env:
          VERBOO_SMOKE_SKIP_SNAPSHOT: '1'
        shell: bash
        run: |
          set -euo pipefail
          # NSIS .exe is a wrapper installer, not the app binary. The smoke
          # must be exercised against the actual `verboo-desktop.exe` so the
          # runtime path is genuinely tested (not just the installer).
          APP_EXE=$(find "src-tauri/target/${{ matrix.target }}/release" -maxdepth 3 -type f -name 'verboo-desktop.exe' | head -1)
          test -n "$APP_EXE"
          node scripts/verify/browser-multiwebview-smoke.mjs "$APP_EXE"

      - name: Run packaged multiwebview runtime smoke (Linux)
        if: runner.os == 'Linux'
        # Skip snapshot on headless CI — same rationale as macOS. Even with
        # xvfb, WebKitGTK's snapshot may fail to compose when no real display
        # is attached.
        env:
          VERBOO_SMOKE_SKIP_SNAPSHOT: '1'
        shell: bash
        # The Linux runtime needs a display server — WebKitGTK cannot create
        # a window without one. `xvfb-run -a` provides an in-memory X server
        # so the smoke runs headlessly. Failure here means a Linux WebKitGTK
        # regression that cross-compile could never catch.
        run: |
          set -euo pipefail

          # Enable core dumps so a crash produces a core file for gdb.
          ulimit -c unlimited
          # %e = executable name, %p = PID — core file is named after the
          # actual crashing binary, not the launcher (xvfb-run/node).
          echo "/tmp/smoke-core.%e.%p" | sudo tee /proc/sys/kernel/core_pattern 2>/dev/null || true

          APP_BIN=$(find "src-tauri/target/${{ matrix.target }}/release" -maxdepth 3 -type f -name 'verboo-desktop' | head -1)
          test -n "$APP_BIN"
          echo "$APP_BIN" | sudo tee /tmp/smoke-app-bin-path.txt >/dev/null || true

          xvfb-run -a node scripts/verify/browser-multiwebview-smoke.mjs "$APP_BIN"

      - name: Debug Linux smoke crash (core dump analysis)
        if: failure() && runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        # Captures a backtrace when the Linux smoke crashes with SIGSEGV.
        # Does NOT change the job outcome (continue-on-error: true) — the job
        # stays red from the smoke failure. The data here replaces guesswork
        # with the actual crash site.
        run: |
          set +e
          APP_BIN="$(cat /tmp/smoke-app-bin-path.txt 2>/dev/null || true)"
          if [ -z "$APP_BIN" ] || [ ! -f "$APP_BIN" ]; then
            APP_BIN=$(find "src-tauri/target/${{ matrix.target }}/release" -maxdepth 3 -type f -name 'verboo-desktop' | head -1)
          fi

          echo "::group::Linux crash diagnostics"
          echo "Binary (from saved path): $APP_BIN"

          # Install gdb quietly.
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb >/dev/null 2>&1

          # Find the most recent core dump — named after the crashing exe
          # (%e) and PID (%p) by the core_pattern we set earlier.
          CORE_FILE="$(ls -t /tmp/smoke-core.* 2>/dev/null | head -1)"
          if [ -n "$CORE_FILE" ] && [ -f "$CORE_FILE" ]; then
            CORE_SIZE="$(stat -c%s "$CORE_FILE" 2>/dev/null || echo '?')"
            echo "Core: $CORE_FILE (${CORE_SIZE}b)"

            # Identify the binary that actually crashed from the core.
            # `file` on an ELF core shows "from '<exe>'" — this is the
            # process that generated the core (NT_PRSTATUS note), not our
            # guess. Backtrace without correct symbols is useless noise.
            echo "Core file info:"
            file "$CORE_FILE"
            CORE_EXE="$(file "$CORE_FILE" | grep -oP "from '\K[^']+")"
            if [ -n "$CORE_EXE" ] && [ -f "$CORE_EXE" ]; then
              echo "Binary from core note: $CORE_EXE"
              echo "  matches saved path: $([ "$CORE_EXE" = "$APP_BIN" ] && echo 'yes' || echo 'no — using core note binary')"
              APP_BIN="$CORE_EXE"
            elif [ -n "$CORE_EXE" ]; then
              echo "Binary from core note: $CORE_EXE (file not found — path may differ; using saved path)"
            fi
            # Command 1: bt full on the crashing thread only — gdb
            # auto-selects the thread that received the signal (confirmed
            # SIGABRT, signal 6, by core dump — not SIGSEGV). This gives
            # the complete stack with local variables for the abort site.
            echo "--- bt full (crashing thread) ---"
            gdb -batch -ex "bt full" "$APP_BIN" "$CORE_FILE" 2>&1
            # Command 2: compact backtrace of ALL threads — shows which
            # thread crashed and what others were doing. No "full" to
            # keep output manageable.
            echo "--- thread apply all bt (compact, all threads) ---"
            gdb -batch -ex "thread apply all bt" "$APP_BIN" "$CORE_FILE" 2>&1 | head -600
          else
            echo "No core dump found at /tmp/smoke-core.*"
            echo "Checking kernel ring buffer for segfault signature..."
            sudo dmesg 2>/dev/null | grep -i "segfault\|verboo-desktop\|smoke" | tail -15 || echo "(no segfault in dmesg — may have been cleared)"
          fi

          # Clean up regardless.
          rm -f /tmp/smoke-core.* /tmp/smoke-app-bin-path.txt
          echo "::endgroup::"

      - name: List bundle tree (debug)
        if: always()
        shell: bash
        run: |
          set +e
          echo "Bundle dirs under src-tauri/target:"
          find src-tauri/target -type d -name bundle 2>/dev/null | head -40
          echo "Candidate installers:"
          find src-tauri/target -type f \( \
            -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.exe' -o -name '*.msi' -o -name '*.app' \) 2>/dev/null | head -50
          true

      # Rename installers so GitHub Release downloads read as plain English:
      #   Verboo-Code-<ver>-macOS-Apple-Silicon.dmg
      #   Verboo-Code-<ver>-macOS-Intel.dmg
      #   Verboo-Code-<ver>-Windows-x64-Setup.exe
      #   Verboo-Code-<ver>-Linux-x64.{AppImage,deb,rpm}
      # (Tauri's default names like *_aarch64.dmg / *_x64.dmg are easy to mix up.)
      - name: Rename installers (human-readable)
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          TARGET="${{ matrix.target }}"
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          OUT="release-assets"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          if [ ! -d "$BUNDLE_ROOT" ]; then
            echo "::error::Bundle root missing: $BUNDLE_ROOT"
            find src-tauri/target -type d -name bundle 2>/dev/null | head -20 || true
            exit 1
          fi
          # Portable bash 3.2 (macOS runners) — no mapfile / process substitution.
          FILES=$(
            find "$BUNDLE_ROOT" -type f \( \
              -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o \
              -name '*.exe' -o -name '*.msi' -o -name '*.rpm' \
            \) 2>/dev/null | sort -u
          )
          if [ -z "$FILES" ]; then
            echo "::error::No installer files under $BUNDLE_ROOT"
            find "$BUNDLE_ROOT" -maxdepth 3 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          friendly_name() {
            # $1 = source path, prints destination basename
            local src="$1"
            local base
            base=$(basename "$src")
            local lower
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')
            case "$TARGET" in
              aarch64-apple-darwin)
                if echo "$lower" | grep -q '\.dmg$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Apple-Silicon.dmg"
                elif echo "$lower" | grep -q '\.zip$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Apple-Silicon.zip"
                else
                  echo "Verboo-Code-${VERSION}-macOS-Apple-Silicon-${base}"
                fi
                ;;
              x86_64-apple-darwin)
                if echo "$lower" | grep -q '\.dmg$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Intel.dmg"
                elif echo "$lower" | grep -q '\.zip$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Intel.zip"
                else
                  echo "Verboo-Code-${VERSION}-macOS-Intel-${base}"
                fi
                ;;
              x86_64-pc-windows-msvc)
                if echo "$lower" | grep -q '\.msi$'; then
                  echo "Verboo-Code-${VERSION}-Windows-x64.msi"
                else
                  echo "Verboo-Code-${VERSION}-Windows-x64-Setup.exe"
                fi
                ;;
              x86_64-unknown-linux-gnu)
                if echo "$lower" | grep -q '\.appimage$'; then
                  echo "Verboo-Code-${VERSION}-Linux-x64.AppImage"
                elif echo "$lower" | grep -q '\.deb$'; then
                  echo "Verboo-Code-${VERSION}-Linux-x64.deb"
                elif echo "$lower" | grep -q '\.rpm$'; then
                  echo "Verboo-Code-${VERSION}-Linux-x64.rpm"
                else
                  echo "Verboo-Code-${VERSION}-Linux-x64-${base}"
                fi
                ;;
              *)
                echo "Verboo-Code-${VERSION}-${TARGET}-${base}"
                ;;
            esac
          }
          echo "$FILES" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(friendly_name "$f")
            echo "Rename: $(basename "$f") → $name"
            cp -f "$f" "$OUT/$name"
          done

          prepare_update() {
            local search_dir="$1"
            local pattern="$2"
            local update_name="$3"
            local update_source
            local update_count
            update_source=$(find "$search_dir" -maxdepth 1 -type f -name "$pattern" | sort -u)
            update_count=$(printf '%s\n' "$update_source" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$update_count" != "1" ]; then
              echo "::error::Expected one updater payload matching $pattern, found $update_count"
              printf '%s\n' "$update_source"
              exit 1
            fi
            if [ ! -s "${update_source}.sig" ]; then
              echo "::error::Missing or empty updater signature for $update_name"
              exit 1
            fi
            cp -f "$update_source" "$OUT/$update_name"
            cp -f "${update_source}.sig" "$OUT/${update_name}.sig"
          }

          case "$TARGET" in
            aarch64-apple-darwin)
              prepare_update "$BUNDLE_ROOT/macos" '*.app.tar.gz' \
                "Verboo-Code-${VERSION}-darwin-aarch64.app.tar.gz"
              ;;
            x86_64-apple-darwin)
              prepare_update "$BUNDLE_ROOT/macos" '*.app.tar.gz' \
                "Verboo-Code-${VERSION}-darwin-x86_64.app.tar.gz"
              ;;
            x86_64-pc-windows-msvc)
              prepare_update "$BUNDLE_ROOT/nsis" '*.exe' \
                "Verboo-Code-${VERSION}-windows-x86_64-setup.exe"
              ;;
            x86_64-unknown-linux-gnu)
              prepare_update "$BUNDLE_ROOT/appimage" '*.AppImage' \
                "Verboo-Code-${VERSION}-linux-x86_64.AppImage"
              prepare_update "$BUNDLE_ROOT/deb" '*.deb' \
                "Verboo-Code-${VERSION}-linux-x86_64.deb"
              prepare_update "$BUNDLE_ROOT/rpm" '*.rpm' \
                "Verboo-Code-${VERSION}-linux-x86_64.rpm"
              ;;
            *)
              echo "::error::Unsupported updater target $TARGET"
              exit 1
              ;;
          esac
          echo "Prepared assets:"
          ls -la "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Verboo-Code-${{ needs.resolve-tag.outputs.version }}-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          OUT="release-assets"
          if [ ! -d "$OUT" ] || [ -z "$(ls -A "$OUT" 2>/dev/null || true)" ]; then
            echo "::error::No renamed assets in $OUT"
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            if [ "$(uname -s)" = "Darwin" ]; then
              brew install gh
            else
              echo "::error::gh CLI not found"
              exit 1
            fi
          fi
          # Write notes via printf (no heredoc — macOS bash 3.2 + YAML indent is fragile).
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes-${VERSION}.md"
          {
            printf '%s\n' "## Verboo Code ${VERSION}"
            printf '%s\n' ""
            printf '%s\n' "This beta brings a macOS embedded browser, secure cross-platform in-app updates, and a more expressive Verboo pet."
            printf '%s\n' ""
            printf '%s\n' "### What's new"
            printf '%s\n' ""
            printf '%s\n' "- On macOS, work beside a live local site in the docked browser, with responsive resizing and automatic refresh after code changes."
            printf '%s\n' "- On macOS, send precise visual feedback to the composer with pen and categorized arrow annotations."
            printf '%s\n' "- Download signed app updates from the sidebar and restart safely after active turns finish, while preserving drafts."
            printf '%s\n' "- Receive installer-specific updates on macOS, Windows, AppImage, Debian/Ubuntu, and Fedora/RHEL."
            printf '%s\n' "- Enjoy richer, state-aware Verboo pet motion with a reduced-motion alternative."
            printf '%s\n' "- Keep terminal and review panels — plus the macOS browser panel — scoped to the chat workspace when opening Settings or Profile."
            printf '%s\n' ""
            printf '%s\n' "### Download the right file"
            printf '%s\n' ""
            printf '%s\n' "| Your computer | Download |"
            printf '%s\n' "|---|---|"
            printf '%s\n' "| **macOS Apple Silicon** (M1 / M2 / M3 / M4) | \`Verboo-Code-${VERSION}-macOS-Apple-Silicon.dmg\` |"
            printf '%s\n' "| **macOS Intel** | \`Verboo-Code-${VERSION}-macOS-Intel.dmg\` |"
            printf '%s\n' "| **Windows 10/11 (64-bit)** | \`Verboo-Code-${VERSION}-Windows-x64-Setup.exe\` |"
            printf '%s\n' "| **Linux (AppImage, any distro)** | \`Verboo-Code-${VERSION}-Linux-x64.AppImage\` |"
            printf '%s\n' "| **Linux Debian/Ubuntu** | \`Verboo-Code-${VERSION}-Linux-x64.deb\` |"
            printf '%s\n' "| **Linux Fedora/RHEL** | \`Verboo-Code-${VERSION}-Linux-x64.rpm\` |"
            printf '%s\n' ""
            printf '%s\n' "> Tip: on a Mac, **Apple menu → About This Mac**. If the chip says Apple M…, pick **Apple Silicon**."
            printf '%s\n' ""
            printf '%s\n' "Assets appear as each platform build finishes."
          } > "$NOTES_FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ needs.resolve-tag.outputs.is_prerelease }}" = "true" ]; then
              gh release create "$TAG" --title "Verboo Code ${VERSION}" --prerelease --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --title "Verboo Code ${VERSION}" --notes-file "$NOTES_FILE"
            fi
          fi
          for f in "$OUT"/*; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate one `latest.json` with installer-specific signed artifacts.
  # ─────────────────────────────────────────────────────────────────────
  publish-updates-manifest:
    name: Publish Tauri update manifests
    needs: [resolve-tag, build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Matches Verboo-Code-<version>-<macOS-arm64|macOS-x64|Windows-x64|Linux-x64>
          pattern: Verboo-Code-*
          merge-multiple: true
          path: bundles

      - name: Generate update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          IS_PRE: ${{ needs.resolve-tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          node scripts/verify/generate-tauri-update-manifest.mjs \
            --tag "$TAG" \
            --version "$VERSION" \
            --prerelease "$IS_PRE" \
            --bundles-dir bundles \
            --output update-manifests

      - name: Upload immutable and rolling update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          MANIFEST="update-manifests/latest.json"
          gh release upload "$TAG" "$MANIFEST" --clobber
          if ! gh release view updater-beta >/dev/null 2>&1; then
            gh release create updater-beta \
              --prerelease \
              --title "Verboo Code beta update channel" \
              --notes "Rolling signed updater manifest."
          fi
          gh release upload updater-beta "$MANIFEST" --clobber
