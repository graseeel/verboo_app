name: Tauri Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.3.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

# Serialize releases so the rolling beta update pointer cannot race.
concurrency:
  group: tauri-release-publish
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Single source of truth for the tag + prerelease flag. Each per-platform
  # job downstream depends on this to avoid repeating the resolution logic.
  # ─────────────────────────────────────────────────────────────────────
  resolve-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          # Strip optional leading "v" for SemVer comparisons.
          VERSION="${TAG#v}"
          # Prerelease if the version matches x.y.z-<channel>.<n>
          if [[ "$VERSION" =~ -(beta|alpha|rc)\.[0-9]+$ ]]; then
            IS_PRE="true"
          else
            IS_PRE="false"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRE" >> "$GITHUB_OUTPUT"

      - name: Verify release versions
        run: node scripts/verify/verify-release-version.mjs --tag "${{ steps.release.outputs.tag }}"

      - name: Test release contracts
        run: node --test scripts/verify/update-manifest.test.mjs scripts/verify/verify-release-version.test.mjs

  # ─────────────────────────────────────────────────────────────────────
  # Per-platform builds. Each job:
  #   1. Installs Rust 1.89.0 (pinned per team memory — proc-macro ABI fix)
  #   2. Installs Node + npm ci
  #   3. Runs `cargo tauri build` to produce the platform-specific bundle
  #   4. Uploads artifacts + publishes a GitHub release entry
  # ─────────────────────────────────────────────────────────────────────
  build-tauri:
    name: Build Tauri (${{ matrix.os }} / ${{ matrix.target }})
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # With `cargo tauri build --target <triple>`, bundles land under
          # src-tauri/target/<triple>/release/bundle/ — NOT target/release/bundle/.
          - os: macos-15
            target: aarch64-apple-darwin
            label: macOS-arm64
            artifact_glob: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-15
            target: x86_64-apple-darwin
            label: macOS-x64
            artifact_glob: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: Windows-x64
            # NSIS only — MSI fails on SemVer prerelease tags (hyphen in version).
            artifact_glob: |
              src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: Linux-x64
            artifact_glob: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Disable code signing by default — secrets can opt-in later.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # Prevent Rust 1.95 (system default) from breaking tauri-cli proc-macros.
      RUSTUP_TOOLCHAIN: "1.89.0"
      # Clear RUSTFLAGS so cargo-tauri's default flags don't break proc-macro
      # linking (ctor-proc-macro "can't find crate" error on Rust 1.89).
      RUSTFLAGS: ""
      # Published Chrome Web Store identity, read at compile time by
      # option_env! (chrome_integration/models.rs, native_host.rs). Without
      # these the shipped app reports "this build has no production extension
      # metadata" and the integration cannot be configured.
      VERBOO_CHROME_EXTENSION_ID: "nkfgdaoblgcbngpklgnmjkfdabpbmpee"
      VERBOO_CHROME_WEB_STORE_URL: "https://chromewebstore.google.com/detail/nkfgdaoblgcbngpklgnmjkfdabpbmpee"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install MSYS2 media build toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-nasm
            autoconf
            automake
            libtool
            make
            gettext-devel

      - name: Install macOS media build toolchain
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool nasm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            cmake \
            pkg-config \
            autoconf \
            automake \
            libtool \
            nasm \
            zlib1g-dev \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Cache verified media sidecar source/build directories
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/verboo-media-sidecars-cache
          key: media-sidecars-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('scripts/tauri/media-sidecars.json', 'scripts/tauri/build-media-sidecars.mjs') }}

      - name: Build renderer + bundle CLI (build:tauri-deps)
        # Mirrors local `npm run tauri:build` deps prep:
        #   1. dedup-cli-package.mjs  — strip iCloud conflict copies
        #   2. copy-cli-resource.mjs — copy cli.mjs + cli-package/ to src-tauri/resources/
        #   3. build:renderer        — tsc --noEmit + vite build → dist-renderer/
        # beforeBuildCommand is intentionally empty in tauri.conf.json (commit 30fd235)
        # to avoid a double vite build locally, so CI must build the renderer here.
        run: npm run build:tauri-deps

      - name: Build Verboo in Chrome sidecar
        run: node scripts/tauri/build-chrome-helper.mjs --target ${{ matrix.target }}

      - name: Build pinned media sidecars
        if: runner.os != 'Windows'
        env:
          # The builder caches only hash-verified source/build directories. It
          # never caches the target-qualified binaries in src-tauri/binaries.
          # (runner.* is a step-level context; job-level env rejects it.)
          VERBOO_MEDIA_SIDECAR_CACHE: ${{ runner.temp }}/verboo-media-sidecars-cache
        run: npm run build:media-sidecars -- --target ${{ matrix.target }}

      - name: Build pinned media sidecars (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          VERBOO_MEDIA_SIDECAR_CACHE: ${{ runner.temp }}/verboo-media-sidecars-cache
        # Strict MSYS2 PATH keeps the perl autotools' prefix detection sane
        # (path-type: inherit mangled the system aclocal dir); node is added
        # explicitly from the runner image install.
        run: |
          export PATH="$PATH:/c/Program Files/nodejs"
          node scripts/tauri/build-media-sidecars.mjs --target ${{ matrix.target }}

      - name: Verify target-qualified media sidecars
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          EXT=""
          if [ "$TARGET" = "x86_64-pc-windows-msvc" ]; then EXT=".exe"; fi
          BINARIES="src-tauri/binaries"
          ls -lh "$BINARIES/verboo-ffmpeg-$TARGET$EXT" \
            "$BINARIES/verboo-ffprobe-$TARGET$EXT" \
            "$BINARIES/verboo-whisper-$TARGET$EXT"
          "$BINARIES/verboo-ffmpeg-$TARGET$EXT" -version
          "$BINARIES/verboo-ffprobe-$TARGET$EXT" -version
          "$BINARIES/verboo-whisper-$TARGET$EXT" --help >/dev/null
          test ! -e "$BINARIES/ggml-base.bin"

      - name: Install tauri-cli
        # Keep the CLI aligned with package.json while the embedded browser
        # depends on Tauri's unstable multiwebview API.
        run: cargo +1.89.0 install tauri-cli --version "2.11.4" --locked

      - name: Run Rust library tests
        # Native browser parity (Tasks 1/2/3/4) adds units tests in lib
        # (browser_panel, browser_platform, etc.) that are part of the
        # `--lib` contract. Failing tests gate the release of THIS platform
        # only — fail-fast:false keeps the other platforms building.
        shell: bash
        run: cargo +1.89.0 test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build Tauri bundle and signed updater artifacts
        env:
          # Clear RUSTFLAGS so cargo-tauri's default flags don't break proc-macro
          # linking (ctor-proc-macro "can't find crate" error on Rust 1.89).
          RUSTFLAGS: ""
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"; exit 1; }
          BUILD_LOG="$RUNNER_TEMP/tauri-build-${{ matrix.target }}.log"
          set +e
          cargo +1.89.0 tauri build --target ${{ matrix.target }} 2>&1 | tee "$BUILD_LOG"
          BUILD_STATUS="${PIPESTATUS[0]}"
          set -e
          if [ "$BUILD_STATUS" -ne 0 ]; then
            exit "$BUILD_STATUS"
          fi
          if grep -Fq "does not match the public key from" "$BUILD_LOG"; then
            echo "::error::Updater private key does not match the exact public key in tauri.conf.json"
            exit 1
          fi
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            BUNDLE_ROOT="src-tauri/target/${{ matrix.target }}/release/bundle"
            for package_dir in deb rpm; do
              PACKAGES=$(find "$BUNDLE_ROOT/$package_dir" -maxdepth 1 -type f -name "*.$package_dir" | sort -u)
              PACKAGE_COUNT=$(printf '%s\n' "$PACKAGES" | sed '/^$/d' | wc -l | tr -d ' ')
              if [ "$PACKAGE_COUNT" != "1" ]; then
                echo "::error::Expected one .$package_dir package, found $PACKAGE_COUNT"
                exit 1
              fi
              cargo +1.89.0 tauri signer sign "$PACKAGES"
            done
          fi

      - name: Run packaged multiwebview runtime smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=$(find "src-tauri/target/${{ matrix.target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' | head -1)
          test -n "$APP_PATH"
          node scripts/verify/browser-multiwebview-smoke.mjs "$APP_PATH"

      - name: Run packaged multiwebview runtime smoke (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # NSIS .exe is a wrapper installer, not the app binary. The smoke
          # must be exercised against the actual `verboo-desktop.exe` so the
          # runtime path is genuinely tested (not just the installer).
          APP_EXE=$(find "src-tauri/target/${{ matrix.target }}/release" -maxdepth 3 -type f -name 'verboo-desktop.exe' | head -1)
          test -n "$APP_EXE"
          node scripts/verify/browser-multiwebview-smoke.mjs "$APP_EXE"

      - name: Run packaged multiwebview runtime smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        # The Linux runtime needs a display server — WebKitGTK cannot create
        # a window without one. `xvfb-run -a` provides an in-memory X server
        # so the smoke runs headlessly. Failure here means a Linux WebKitGTK
        # regression that cross-compile could never catch.
        run: |
          set -euo pipefail
          APP_BIN=$(find "src-tauri/target/${{ matrix.target }}/release" -maxdepth 3 -type f -name 'verboo-desktop' | head -1)
          test -n "$APP_BIN"
          xvfb-run -a node scripts/verify/browser-multiwebview-smoke.mjs "$APP_BIN"

      - name: List bundle tree (debug)
        if: always()
        shell: bash
        run: |
          set +e
          echo "Bundle dirs under src-tauri/target:"
          find src-tauri/target -type d -name bundle 2>/dev/null | head -40
          echo "Candidate installers:"
          find src-tauri/target -type f \( \
            -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o \
            -name '*.exe' -o -name '*.msi' -o -name '*.app' \) 2>/dev/null | head -50
          true

      # Rename installers so GitHub Release downloads read as plain English:
      #   Verboo-Code-<ver>-macOS-Apple-Silicon.dmg
      #   Verboo-Code-<ver>-macOS-Intel.dmg
      #   Verboo-Code-<ver>-Windows-x64-Setup.exe
      #   Verboo-Code-<ver>-Linux-x64.{AppImage,deb,rpm}
      # (Tauri's default names like *_aarch64.dmg / *_x64.dmg are easy to mix up.)
      - name: Rename installers (human-readable)
        id: rename
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          VERSION="${TAG#v}"
          TARGET="${{ matrix.target }}"
          BUNDLE_ROOT="src-tauri/target/${TARGET}/release/bundle"
          OUT="release-assets"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          if [ ! -d "$BUNDLE_ROOT" ]; then
            echo "::error::Bundle root missing: $BUNDLE_ROOT"
            find src-tauri/target -type d -name bundle 2>/dev/null | head -20 || true
            exit 1
          fi
          # Portable bash 3.2 (macOS runners) — no mapfile / process substitution.
          FILES=$(
            find "$BUNDLE_ROOT" -type f \( \
              -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' -o \
              -name '*.exe' -o -name '*.msi' -o -name '*.rpm' \
            \) 2>/dev/null | sort -u
          )
          if [ -z "$FILES" ]; then
            echo "::error::No installer files under $BUNDLE_ROOT"
            find "$BUNDLE_ROOT" -maxdepth 3 -type f 2>/dev/null | head -50 || true
            exit 1
          fi
          friendly_name() {
            # $1 = source path, prints destination basename
            local src="$1"
            local base
            base=$(basename "$src")
            local lower
            lower=$(echo "$base" | tr '[:upper:]' '[:lower:]')
            case "$TARGET" in
              aarch64-apple-darwin)
                if echo "$lower" | grep -q '\.dmg$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Apple-Silicon.dmg"
                elif echo "$lower" | grep -q '\.zip$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Apple-Silicon.zip"
                else
                  echo "Verboo-Code-${VERSION}-macOS-Apple-Silicon-${base}"
                fi
                ;;
              x86_64-apple-darwin)
                if echo "$lower" | grep -q '\.dmg$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Intel.dmg"
                elif echo "$lower" | grep -q '\.zip$'; then
                  echo "Verboo-Code-${VERSION}-macOS-Intel.zip"
                else
                  echo "Verboo-Code-${VERSION}-macOS-Intel-${base}"
                fi
                ;;
              x86_64-pc-windows-msvc)
                if echo "$lower" | grep -q '\.msi$'; then
                  echo "Verboo-Code-${VERSION}-Windows-x64.msi"
                else
                  echo "Verboo-Code-${VERSION}-Windows-x64-Setup.exe"
                fi
                ;;
              x86_64-unknown-linux-gnu)
                if echo "$lower" | grep -q '\.appimage$'; then
                  echo "Verboo-Code-${VERSION}-Linux-x64.AppImage"
                elif echo "$lower" | grep -q '\.deb$'; then
                  echo "Verboo-Code-${VERSION}-Linux-x64.deb"
                elif echo "$lower" | grep -q '\.rpm$'; then
                  echo "Verboo-Code-${VERSION}-Linux-x64.rpm"
                else
                  echo "Verboo-Code-${VERSION}-Linux-x64-${base}"
                fi
                ;;
              *)
                echo "Verboo-Code-${VERSION}-${TARGET}-${base}"
                ;;
            esac
          }
          echo "$FILES" | while IFS= read -r f; do
            [ -z "$f" ] && continue
            name=$(friendly_name "$f")
            echo "Rename: $(basename "$f") → $name"
            cp -f "$f" "$OUT/$name"
          done

          prepare_update() {
            local search_dir="$1"
            local pattern="$2"
            local update_name="$3"
            local update_source
            local update_count
            update_source=$(find "$search_dir" -maxdepth 1 -type f -name "$pattern" | sort -u)
            update_count=$(printf '%s\n' "$update_source" | sed '/^$/d' | wc -l | tr -d ' ')
            if [ "$update_count" != "1" ]; then
              echo "::error::Expected one updater payload matching $pattern, found $update_count"
              printf '%s\n' "$update_source"
              exit 1
            fi
            if [ ! -s "${update_source}.sig" ]; then
              echo "::error::Missing or empty updater signature for $update_name"
              exit 1
            fi
            cp -f "$update_source" "$OUT/$update_name"
            cp -f "${update_source}.sig" "$OUT/${update_name}.sig"
          }

          case "$TARGET" in
            aarch64-apple-darwin)
              prepare_update "$BUNDLE_ROOT/macos" '*.app.tar.gz' \
                "Verboo-Code-${VERSION}-darwin-aarch64.app.tar.gz"
              ;;
            x86_64-apple-darwin)
              prepare_update "$BUNDLE_ROOT/macos" '*.app.tar.gz' \
                "Verboo-Code-${VERSION}-darwin-x86_64.app.tar.gz"
              ;;
            x86_64-pc-windows-msvc)
              prepare_update "$BUNDLE_ROOT/nsis" '*.exe' \
                "Verboo-Code-${VERSION}-windows-x86_64-setup.exe"
              ;;
            x86_64-unknown-linux-gnu)
              prepare_update "$BUNDLE_ROOT/appimage" '*.AppImage' \
                "Verboo-Code-${VERSION}-linux-x86_64.AppImage"
              prepare_update "$BUNDLE_ROOT/deb" '*.deb' \
                "Verboo-Code-${VERSION}-linux-x86_64.deb"
              prepare_update "$BUNDLE_ROOT/rpm" '*.rpm' \
                "Verboo-Code-${VERSION}-linux-x86_64.rpm"
              ;;
            *)
              echo "::error::Unsupported updater target $TARGET"
              exit 1
              ;;
          esac
          echo "Prepared assets:"
          ls -la "$OUT"
          echo "dir=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Verboo-Code-${{ needs.resolve-tag.outputs.version }}-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          VERSION="${{ needs.resolve-tag.outputs.version }}"
          OUT="release-assets"
          if [ ! -d "$OUT" ] || [ -z "$(ls -A "$OUT" 2>/dev/null || true)" ]; then
            echo "::error::No renamed assets in $OUT"
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            if [ "$(uname -s)" = "Darwin" ]; then
              brew install gh
            else
              echo "::error::gh CLI not found"
              exit 1
            fi
          fi
          # Write notes via printf (no heredoc — macOS bash 3.2 + YAML indent is fragile).
          NOTES_FILE="${RUNNER_TEMP:-/tmp}/release-notes-${VERSION}.md"
          {
            printf '%s\n' "## Verboo Code ${VERSION}"
            printf '%s\n' ""
            printf '%s\n' "This beta brings a macOS embedded browser, secure cross-platform in-app updates, and a more expressive Verboo pet."
            printf '%s\n' ""
            printf '%s\n' "### What's new"
            printf '%s\n' ""
            printf '%s\n' "- On macOS, work beside a live local site in the docked browser, with responsive resizing and automatic refresh after code changes."
            printf '%s\n' "- On macOS, send precise visual feedback to the composer with pen and categorized arrow annotations."
            printf '%s\n' "- Download signed app updates from the sidebar and restart safely after active turns finish, while preserving drafts."
            printf '%s\n' "- Receive installer-specific updates on macOS, Windows, AppImage, Debian/Ubuntu, and Fedora/RHEL."
            printf '%s\n' "- Enjoy richer, state-aware Verboo pet motion with a reduced-motion alternative."
            printf '%s\n' "- Keep terminal and review panels — plus the macOS browser panel — scoped to the chat workspace when opening Settings or Profile."
            printf '%s\n' ""
            printf '%s\n' "### Download the right file"
            printf '%s\n' ""
            printf '%s\n' "| Your computer | Download |"
            printf '%s\n' "|---|---|"
            printf '%s\n' "| **macOS Apple Silicon** (M1 / M2 / M3 / M4) | \`Verboo-Code-${VERSION}-macOS-Apple-Silicon.dmg\` |"
            printf '%s\n' "| **macOS Intel** | \`Verboo-Code-${VERSION}-macOS-Intel.dmg\` |"
            printf '%s\n' "| **Windows 10/11 (64-bit)** | \`Verboo-Code-${VERSION}-Windows-x64-Setup.exe\` |"
            printf '%s\n' "| **Linux (AppImage, any distro)** | \`Verboo-Code-${VERSION}-Linux-x64.AppImage\` |"
            printf '%s\n' "| **Linux Debian/Ubuntu** | \`Verboo-Code-${VERSION}-Linux-x64.deb\` |"
            printf '%s\n' "| **Linux Fedora/RHEL** | \`Verboo-Code-${VERSION}-Linux-x64.rpm\` |"
            printf '%s\n' ""
            printf '%s\n' "> Tip: on a Mac, **Apple menu → About This Mac**. If the chip says Apple M…, pick **Apple Silicon**."
            printf '%s\n' ""
            printf '%s\n' "Assets appear as each platform build finishes."
          } > "$NOTES_FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "${{ needs.resolve-tag.outputs.is_prerelease }}" = "true" ]; then
              gh release create "$TAG" --title "Verboo Code ${VERSION}" --prerelease --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --title "Verboo Code ${VERSION}" --notes-file "$NOTES_FILE"
            fi
          fi
          for f in "$OUT"/*; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --clobber
          done

  # ─────────────────────────────────────────────────────────────────────
  # Aggregate one `latest.json` with installer-specific signed artifacts.
  # ─────────────────────────────────────────────────────────────────────
  publish-updates-manifest:
    name: Publish Tauri update manifests
    needs: [resolve-tag, build-tauri]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # Matches Verboo-Code-<version>-<macOS-arm64|macOS-x64|Windows-x64|Linux-x64>
          pattern: Verboo-Code-*
          merge-multiple: true
          path: bundles

      - name: Generate update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve-tag.outputs.tag }}
          VERSION: ${{ needs.resolve-tag.outputs.version }}
          IS_PRE: ${{ needs.resolve-tag.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          node scripts/verify/generate-tauri-update-manifest.mjs \
            --tag "$TAG" \
            --version "$VERSION" \
            --prerelease "$IS_PRE" \
            --bundles-dir bundles \
            --output update-manifests

      - name: Upload immutable and rolling update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          MANIFEST="update-manifests/latest.json"
          gh release upload "$TAG" "$MANIFEST" --clobber
          if ! gh release view updater-beta >/dev/null 2>&1; then
            gh release create updater-beta \
              --prerelease \
              --title "Verboo Code beta update channel" \
              --notes "Rolling signed updater manifest."
          fi
          gh release upload updater-beta "$MANIFEST" --clobber
