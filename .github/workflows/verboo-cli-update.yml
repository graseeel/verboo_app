name: Verboo CLI dependency update

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Enable Corepack
        run: corepack enable

      - name: Resolve and pin the latest CLI
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').dependencies['@verboo/code']")
          LATEST=$(npm view @verboo/code version)
          node scripts/verify/update-cli-dependency.mjs --version "$LATEST"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify the bundled CLI
        run: node scripts/verify/copy-cli-resource.mjs

      - name: Test renderer
        run: npm test

      - name: Build renderer
        run: npm run build:renderer

      - name: Create reviewed update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/verboo-cli-${{ steps.versions.outputs.latest }}
          delete-branch: true
          commit-message: "chore(cli): update bundled CLI to ${{ steps.versions.outputs.latest }}"
          title: "chore(cli): update bundled CLI to ${{ steps.versions.outputs.latest }}"
          body: |
            Updates the pinned bundled CLI from `${{ steps.versions.outputs.current }}` to `${{ steps.versions.outputs.latest }}`.

            This pull request is never auto-merged or auto-released.
          add-paths: |
            package.json
            package-lock.json
            pnpm-lock.yaml
