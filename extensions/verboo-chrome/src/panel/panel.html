<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verboo</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="app" id="app" data-auth="signed-out">

    <!-- ═══════════════════════════════════════════════════════════
         SIGNED-OUT: Verboo API key login.
         Get the key from code.verboo.ai dashboard → account plan.
         ═══════════════════════════════════════════════════════════ -->
    <section class="login-gate" id="login-gate" aria-label="Sign in">
      <div class="login-card">
        <img
          class="login-mascot"
          src="/icons/verboo-mascot.png"
          width="56"
          height="56"
          alt=""
          decoding="async"
        />
        <h1 class="login-title" data-i18n="branding_title">Verboo</h1>
        <p class="login-tagline" data-i18n="branding_tagline">Control Chrome with Verboo</p>
        <p class="login-copy" data-i18n="auth_apiKeyIntro">
          Paste your Verboo API key from your account plan.
        </p>

        <form class="login-form" id="login-form" novalidate>
          <label class="field-label" for="login-api-key" data-i18n="auth_apiKeyLabel">
            API key
          </label>
          <div class="field-input-wrap">
            <input
              type="password"
              id="login-api-key"
              class="field-input"
              name="apiKey"
              autocomplete="off"
              spellcheck="false"
              autocapitalize="off"
              required
              data-i18n-placeholder="auth_apiKeyPlaceholder"
              placeholder="vboo_••••••••••••••••"
            />
            <button
              type="button"
              class="field-input-suffix"
              id="login-key-toggle"
              title="Show / hide key"
              data-i18n-title="auth_apiKeyToggle"
              data-i18n-aria-label="auth_apiKeyToggle"
              aria-label="Show / hide key"
              tabindex="-1"
            >
              <svg
                viewBox="0 0 16 16"
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2 8s2.5-4.5 6-4.5S14 8 14 8s-2.5 4.5-6 4.5S2 8 2 8z" />
                <circle cx="8" cy="8" r="2" />
              </svg>
            </button>
          </div>
          <p class="field-error" id="login-error" role="alert" hidden></p>

          <button
            class="btn btn-primary btn-block"
            type="submit"
            id="login-submit"
            data-i18n="auth_login"
            data-loading-text="auth_loginLoading"
          >
            <span class="btn-label" data-i18n="auth_login">Sign in</span>
            <span class="btn-spinner" aria-hidden="true">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                <path d="M8 2a6 6 0 016 6" />
              </svg>
            </span>
          </button>
        </form>

        <div class="login-links">
          <a
            class="text-link"
            href="https://code.verboo.ai/pt"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="auth_createAccount"
          >
            Create account
          </a>
          <a
            class="text-link"
            href="https://code.verboo.ai"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="auth_openDashboard"
          >
            Open dashboard
          </a>
        </div>
      </div>
      <p class="login-disclaimer" data-i18n="disclaimer_text">
        Independent build. Authorized but not an official Verboo Inc. product.
      </p>
    </section>

    <!-- ═══════════════════════════════════════════════════════════
         SIGNED-IN: chat-first. Composer + mode chip at the bottom;
         permissions & grants live in chrome.runtime.openOptionsPage.
         ═══════════════════════════════════════════════════════════ -->
    <div class="workspace" id="workspace" hidden>
      <header class="topbar">
        <div class="topbar-brand" id="topbar-brand">
          <img
            class="topbar-mascot"
            src="/icons/verboo-mascot.png"
            width="24"
            height="24"
            alt=""
            decoding="async"
          />
          <span class="sr-only" data-i18n="branding_title">Verboo</span>
          <!-- Email / account kept off-layout; surface via brand title attr in JS -->
          <span class="topbar-user" id="topbar-user" hidden></span>
        </div>
        <div class="model-picker" id="model-picker">
          <button
            type="button"
            class="model-picker-trigger"
            id="model-picker-trigger"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="model-menu"
            data-i18n-aria-label="model_picker_label"
            aria-label="Choose model"
            disabled
          >
            <span class="model-picker-copy">
              <span class="model-picker-name" id="model-picker-name" data-i18n="model_loading">Loading models…</span>
              <span class="model-picker-meta" id="model-picker-meta"></span>
            </span>
            <span class="model-picker-caret" aria-hidden="true">
              <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 5l3 3 3-3" />
              </svg>
            </span>
          </button>
          <div
            class="model-menu"
            id="model-menu"
            role="listbox"
            data-i18n-aria-label="model_picker_label"
            aria-label="Choose model"
            hidden
          ></div>
        </div>
        <div class="topbar-actions">
          <button
            type="button"
            class="icon-btn"
            id="settings-btn"
            title="Settings"
            data-i18n-title="topbar_settingsTitle"
            data-i18n-aria-label="topbar_settingsTitle"
            aria-label="Settings"
          >
            <svg
              class="icon-btn-glyph"
              viewBox="0 0 16 16"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="8" cy="8" r="2.25" />
              <path d="M8 1.5v1.5M8 13v1.5M3.05 3.05l1.05 1.05M11.9 11.9l1.05 1.05M1.5 8h1.5M13 8h1.5M3.05 12.95l1.05-1.05M11.9 4.1l1.05-1.05" />
            </svg>
          </button>
          <button
            type="button"
            class="icon-btn"
            id="auth-action"
            data-action="logout"
            data-i18n-title="auth_logout"
            data-i18n-aria-label="auth_logout"
            title="Sign out"
            aria-label="Sign out"
          >
            <svg
              viewBox="0 0 16 16"
              width="16"
              height="16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9.5 12V13a1.5 1.5 0 01-1.5 1.5h-5A1.5 1.5 0 011.5 13V3A1.5 1.5 0 013 1.5h5A1.5 1.5 0 019.5 3v1" />
              <path d="M14.5 8H6m5-2.5L14 8l-3 2.5" />
            </svg>
          </button>
        </div>
      </header>

      <!-- Primary: chat transcript takes the entire body -->
      <section class="chat" aria-label="Chat">
        <div
          class="chat-messages"
          id="chat-messages"
          aria-live="polite"
          data-empty="chat_greeting"
        ></div>

        <div class="chat-foot">
          <form class="chat-composer" id="chat-form">
            <input
              type="text"
              id="chat-input"
              class="field-input chat-input"
              data-i18n-placeholder="chat_placeholder"
              placeholder="Ask Verboo to control this page…"
              autocomplete="off"
              aria-label="Message"
            />
            <div class="composer-toolbar">
              <div class="mode-inline" role="radiogroup" data-i18n-aria-label="mode_title" aria-label="Permission mode">
                <label class="mode-chip" data-mode="manual">
                  <input type="radio" name="mode" value="manual" checked />
                  <span class="mode-chip-label" data-i18n="mode_short_manual">
                    Ask before acting
                  </span>
                </label>
                <label class="mode-chip" data-mode="skip">
                  <input type="radio" name="mode" value="skip" />
                  <span class="mode-chip-label" data-i18n="mode_short_skip">
                    Act without asking
                  </span>
                </label>
              </div>
              <div class="composer-submit">
                <button
                  type="submit"
                  class="icon-send"
                  id="chat-send"
                  title="Send"
                  data-i18n-title="chat_sendTitle"
                  data-i18n-aria-label="chat_sendTitle"
                  aria-label="Send"
                  disabled
                >
                  <svg
                    viewBox="0 0 16 16"
                    width="16"
                    height="16"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.75"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path d="M3 12.5L13 8 3 3.5l1.8 4.5L9.5 8 4.8 8z" />
                  </svg>
                </button>
                <button
                  type="button"
                  class="icon-send icon-stop"
                  id="chat-stop"
                  title="Stop"
                  data-i18n-title="chat_stopTitle"
                  data-i18n-aria-label="chat_stopTitle"
                  aria-label="Stop"
                  hidden
                >
                  <svg
                    viewBox="0 0 16 16"
                    width="16"
                    height="16"
                    fill="currentColor"
                    aria-hidden="true"
                  >
                    <rect x="4.25" y="4.25" width="7.5" height="7.5" rx="1.5" />
                  </svg>
                </button>
              </div>
            </div>
          </form>
        </div>
      </section>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
