[package]
name = "verboo-desktop"
version = "0.7.3"
description = "Verboo Code Desktop (Tauri v2)"
authors = ["Gabriel Grasel de Moura <graseeel@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/graseeel/verboo_app"
edition = "2021"
resolver = "2"

[lib]
name = "verboo_desktop_lib"
# staticlib + cdylib are required by Tauri's build system for bundling.
# Only `rlib` is needed for `cargo test`, but keeping all three avoids
# proc-macro build order issues (notably `ctor 0.8.0` / `ctor-proc-macro`).
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "verboo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core ───────────────────────────────────────────────────
# `custom-protocol` is enabled permanently so `cargo build --release` and
# `cargo tauri build` produce identical proc-macro dylibs. Without this,
# tauri-cli adds `--features tauri/custom-protocol` at build time, which
# regenerates tauri-macros with a different metadata hash — and the
# regenerated dylib is corrupted on Rust 1.89+ ("mis-aligned LINKEDIT
# string pool" on dlopen).
# `unstable` exposes the multiwebview API (Window::add_child) used by the
# embedded Browser panel (ADR-0001). Pinned to =2.11.5 (the version
# validated during the Fase 0 spike) so a transparent `cargo update`
# can't silently change unstable behavior — see ADR-0001 consequences.
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png", "custom-protocol", "protocol-asset", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"

# ── HTTP / TLS (rustls ONLY — NEVER native-tls) ─────────────────
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "blocking",
  "rustls-tls",
] }

# ── Serialization ────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Power management ──────────────────────────────────────────────
# keepawake: cross-platform (macOS IOKit, Windows SetThreadExecutionState,
# Linux systemd-inhibit/dbus). Used by TurnService to honor
# `UserSettings.prevent_sleep_while_running` while a turn is active.
keepawake = "0.6"

# ── Async ────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Utilities ────────────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
image = "0.25"
dirs = "6"
tempfile = "3"
# Pure-Rust PDF text extraction. Used by file_service to extract readable
# text from attached PDFs so any model (vision or not) can reason about
# the content instead of hallucinating from a metadata-only tool_result.
pdf-extract = "0.12"
# Base64 encoding for image attachments sent via stream-json stdin (FASE 0)
# and SHA-256 hashing for vision fallback cache (FASE 1).
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
minisign-verify = "0.2.5"
semver = { version = "1", features = ["serde"] }
flate2 = "1"
tar = "0.4"
url = "2"
# Force ctor to 1.0.x. ctor 0.8 (pulled transitively by tauri-utils) depends
# on ctor-proc-macro as a separate crate, which fails to link in release
# builds with "can't find crate for ctor_proc_macro" on Rust 1.89 + tauri
# 2.11. ctor 1.0 re-merges the macro back into the main crate.
ctor = "=1.0.8"

# ── Credentials ──────────────────────────────────────────────────
# Platform-native credential stores:
#   - macOS: Keychain (apple-native)
#   - Windows: Credential Manager (windows-native)
#   - Linux: libsecret via D-Bus (sync-secret-service)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# ── Terminal (PTY) ──────────────────────────────────────────────
portable-pty = "0.8"

# ── Unix-specific ────────────────────────────────────────────────
[target.'cfg(unix)'.dependencies]
libc = "0.2"
xz2 = { version = "0.1", features = ["static"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
# Native WKWebView access for the Browser panel (snapshot, evaluateJS with
# result, script message handler). Versions match what wry already pulls so
# no duplicate objc2 stack is compiled.
objc2 = "0.6"
# NSBundle (feature) lê o Info.plist do Safari pelo parser do SISTEMA —
# trata plist XML e binário. FRENTE-GOOGLE.
objc2-foundation = { version = "0.3", features = ["NSBundle"] }
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_Foundation",
] }
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
cairo-rs = { version = "=0.18.5", features = ["png"] }
glib = "=0.18.5"
gio = "=0.18.4"
javascriptcore-rs = "=1.1.2"

[profile.release]
# NOTE: `panic = "abort"` was removed because `arboard` (a transitive dep of
# `tauri-plugin-clipboard-manager`, which Fase 4 made load-bearing) requires
# `panic_unwind` for FFI safety when calling system clipboard APIs. Mixing
# abort and unwind across the dep graph breaks the link step.
# NOTE: `codegen-units = 1` was removed because it causes `ctor_proc_macro`
# "can't find crate" errors on Rust 1.89 + ctor 0.8. The default 16 units
# works fine. The size/optimization loss is negligible.
# NOTE: `lto = true` is intentionally omitted. `tauri build` adds
# `-C linker-plugin-lto` to RUSTFLAGS, which regenerates proc-macro dylibs
# (tauri-macros, ctor-proc-macro) with a different metadata hash than
# `cargo build --release` produces. The result is "can't find crate" errors
# because the hash in the filename doesn't match the metadata inside.
# Skipping LTO keeps proc-macro metadata stable across both invocations.
# `strip` is set explicitly to `"none"`. Omitting it is NOT safe: since Cargo
# 1.77 the default is `strip = "debuginfo"`, and that is exactly what corrupts
# proc-macro dylibs on macOS ("mis-aligned LINKEDIT string pool" — dlopen
# fails, breaking tauri-macros and ctor-proc-macro). The binary size cost is
# ~5MB, acceptable for now. We can strip the final binary post-build with
# `strip -x` if needed.
strip = "none"

# WebView2 completes controller creation through COM re-entrancy. Wry 0.55.1
# waits through a channel and a nested Win32 message pump, which can deadlock
# while creating a second controller. Keep that exact release locally and
# patch only its Windows async completion waits until upstream ships the fix.
[patch.crates-io]
wry = { path = "vendor/wry" }
